name: Verify compressed 13F production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-13f-compressed-production.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install boto3
      - name: Verify pointer manifest representations hashes and readback
        run: |
          python - <<'PY'
          import boto3,gzip,hashlib,json,os
          s3=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],region_name='auto'); b=os.environ['R2_BUCKET_NAME']
          raw=lambda k:s3.get_object(Bucket=b,Key=k)['Body'].read()
          ptr=json.loads(raw('institutional_sponsorship/current.json')); assert ptr['status']=='READY'; assert ptr['storage_contract']=='lossless-gzip-v1-selective'
          manifest=json.loads(raw(ptr['manifest_key'])); assert manifest['snapshot_prefix']==ptr['snapshot_prefix']; assert manifest['storage_contract']==ptr['storage_contract']
          compressed=[]
          for logical,m in manifest['artifacts'].items():
            body=raw(m['key']); assert len(body)==m['stored_size_bytes']
            if m['representation']=='gzip':
              assert hashlib.sha256(body).hexdigest()==m['stored_sha256']; decoded=gzip.decompress(body); assert hashlib.sha256(decoded).hexdigest()==m['logical_sha256']; assert len(decoded)==m['logical_size_bytes']; compressed.append(logical)
            else:
              assert hashlib.sha256(body).hexdigest()==m['logical_sha256']
          # Existing pointer contract remains legacy-readable.
          for field in ['history_state_events_key','final_period_state_key','uncertainty_state_events_key','current_uncertainty_state_key','live_sponsorship_mapped_key','live_amendment_lineage_key','live_summary_key']:
            assert not ptr[field].endswith('.gz'), field
            assert raw(ptr[field]) is not None
          total=0; objects=0; token=None
          while True:
            kw={'Bucket':b,'Prefix':'institutional_sponsorship/'}
            if token: kw['ContinuationToken']=token
            r=s3.list_objects_v2(**kw)
            for o in r.get('Contents',[]): total+=int(o['Size']); objects+=1
            if not r.get('IsTruncated'): break
            token=r['NextContinuationToken']
          report={'pointer':ptr,'storage_summary':manifest['storage_summary'],'compressed_artifacts':compressed,'namespace_bytes':total,'namespace_objects':objects,'readback_pass':True}
          open('13f-compressed-production-verify.json','w').write(json.dumps(report,indent=2,sort_keys=True)); print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: 13f-compressed-production-verify-${{ github.run_id }}
          path: 13f-compressed-production-verify.json
