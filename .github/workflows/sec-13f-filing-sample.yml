name: SEC 13F filing parser validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sec-13f-filing-sample.yml'
      - 'src/ussy_fundamentals/sec_13f_filing.py'
      - 'src/ussy_fundamentals/sec_13f_sample.py'
      - 'tests/test_sec_13f_filing.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install pytest
      - name: Run 13F filing parser tests
        run: pytest -q tests/test_sec_13f_filing.py tests/test_sec_13f_index.py
      - name: Parse Q2 2026 filing sample
        run: python -m ussy_fundamentals.sec_13f_sample --year 2026 --quarter 2 --limit 50 --output-dir data/13f/sample
      - name: Show summary
        run: cat data/13f/sample/summary.json
      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: sec-13f-filing-sample-${{ github.run_id }}
          path: data/13f/sample/
          retention-days: 14
