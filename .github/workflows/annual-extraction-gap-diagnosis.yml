name: Diagnose annual extraction gaps

on:
  push:
    branches: [main]
    paths:
      - "src/ussy_fundamentals/annual_gap_diagnose.py"
      - "tests/test_annual_gap_diagnose.py"
      - ".github/workflows/annual-extraction-gap-diagnosis.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install pytest

      - name: Run regression tests
        run: pytest -q

      - name: Download annual LT3 verification artifact
        uses: actions/download-artifact@v4
        with:
          name: annual-lt3-history-verification
          path: seed
          repository: ${{ github.repository }}
          run-id: 34305471332
          github-token: ${{ github.token }}

      - name: Diagnose 21 domestic extraction gaps
        run: |
          mkdir -p data/processed
          cp seed/annual_lt3_verification.csv data/processed/annual_lt3_verification.csv
          python -m ussy_fundamentals.annual_gap_diagnose

      - name: Upload annual extraction gap diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: annual-extraction-gap-diagnosis
          path: |
            data/processed/annual_extraction_gap_diagnosis.csv
            data/processed/annual_extraction_gap_diagnosis_summary.json
          if-no-files-found: error
          retention-days: 14
