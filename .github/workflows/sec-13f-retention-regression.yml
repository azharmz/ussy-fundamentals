name: SEC 13F retention regression
on:
  push:
    branches: [main]
    paths:
      - '.github/run-sec-13f-retention-regression'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e . pytest
      - run: pytest -q tests/test_sec_13f_publish.py
