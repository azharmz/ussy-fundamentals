name: Bootstrap final production to R2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-final-production-r2.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: bootstrap-final-production-r2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install pytest
      - name: Run publisher regression tests
        run: pytest -q tests/test_publish_r2.py
      - name: Download successful final production artifact
        uses: actions/download-artifact@v8
        with:
          name: fundamentals-final-production
          path: data/processed
          repository: ${{ github.repository }}
          run-id: '34329089064'
          github-token: ${{ github.token }}
      - name: Verify expected package
        run: |
          test -f data/processed/fundamentals_point_in_time.parquet
          test -f data/processed/fundamentals_point_in_time_long.parquet
          test -f data/processed/fundamentals_final_production_summary.json
          test -f data/processed/current_universe_source.json
          cat data/processed/fundamentals_final_production_summary.json
      - name: Publish immutable snapshot and current pointer
        run: |
          python -m ussy_fundamentals.publish_r2 \
            --source-run-id 34329089064 \
            --source-commit 0aefb58af9aba1e3961f3ab6c2730f3b7c220ff5 \
            --snapshot-date 2026-09-09
