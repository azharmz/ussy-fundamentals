name: Probe residual revenue comparator values

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/ussy_fundamentals/revenue_comparator_value_probe.py'
      - '.github/workflows/revenue-comparator-value-probe.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install pytest
      - name: Run regression tests
        run: pytest -q
      - name: Download fixable residual probe
        uses: actions/download-artifact@v4
        with:
          name: residual-revenue-fixable-probe
          path: seed
          repository: azharmz/ussy-fundamentals
          run-id: 34326205242
          github-token: ${{ github.token }}
      - name: Probe comparator values
        run: |
          mkdir -p data/processed
          cp seed/residual_revenue_fixable_probe.csv data/processed/residual_revenue_fixable_probe.csv
          python -m ussy_fundamentals.revenue_comparator_value_probe
          cat data/processed/revenue_comparator_value_probe_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: revenue-comparator-value-probe
          path: |
            data/processed/revenue_comparator_value_probe.csv
            data/processed/revenue_comparator_value_probe_summary.json
          if-no-files-found: error
          retention-days: 14
