name: Audit 13F compression ratios
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-13f-compression.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install boto3
      - name: Measure canonical snapshot gzip ratios
        run: |
          python - <<'PY'
          import boto3, gzip, hashlib, json, os
          s3=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],region_name='auto')
          b=os.environ['R2_BUCKET_NAME']
          ptr=json.loads(s3.get_object(Bucket=b,Key='institutional_sponsorship/current.json')['Body'].read())
          prefix=ptr['snapshot_prefix'].rstrip('/')+'/'
          rows=[]; token=None
          while True:
            kw={'Bucket':b,'Prefix':prefix}
            if token: kw['ContinuationToken']=token
            r=s3.list_objects_v2(**kw)
            for o in r.get('Contents',[]):
              key=o['Key']; raw=s3.get_object(Bucket=b,Key=key)['Body'].read()
              gz=gzip.compress(raw,compresslevel=6,mtime=0)
              rows.append({'key':key,'original_bytes':len(raw),'gzip_bytes':len(gz),'bytes_saved':len(raw)-len(gz),'ratio':round(len(gz)/len(raw),6) if raw else 1.0,'sha256':hashlib.sha256(raw).hexdigest(),'gzip_sha256':hashlib.sha256(gz).hexdigest()})
            if not r.get('IsTruncated'): break
            token=r['NextContinuationToken']
          out={'snapshot_prefix':prefix,'objects':rows,'original_bytes':sum(x['original_bytes'] for x in rows),'gzip_bytes':sum(x['gzip_bytes'] for x in rows),'bytes_saved':sum(x['bytes_saved'] for x in rows)}
          open('13f-compression-audit.json','w').write(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: 13f-compression-audit-${{ github.run_id }}
          path: 13f-compression-audit.json
