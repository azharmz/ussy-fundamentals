name: Probe quarterly EPS comparator gaps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/ussy_fundamentals/quarterly_eps_comparator_probe.py'
      - '.github/workflows/quarterly-eps-comparator-probe.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Download latest quarterly EPS diagnosis
        uses: actions/download-artifact@v4
        with:
          name: quarterly-eps-gap-diagnosis
          path: seed
          repository: azharmz/ussy-fundamentals
          run-id: 34311294430
          github-token: ${{ github.token }}
      - name: Probe comparator gaps
        run: |
          mkdir -p data/processed
          cp seed/quarterly_eps_gap_diagnosis.csv data/processed/quarterly_eps_gap_diagnosis.csv
          python -m ussy_fundamentals.quarterly_eps_comparator_probe
      - uses: actions/upload-artifact@v4
        with:
          name: quarterly-eps-comparator-probe
          path: data/processed/quarterly_eps_comparator_probe.csv
          if-no-files-found: error
          retention-days: 14
