name: Validate annual EPS fallback fix

on:
  push:
    branches: [main]
    paths:
      - 'src/ussy_fundamentals/annual_fallback.py'
      - 'tests/test_annual_fallback_state.py'
      - '.github/workflows/validate-annual-fallback-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install pytest
      - name: Run regression tests
        run: pytest -q
      - name: Build targeted validation universe
        run: |
          cat > data/universe.annual-fallback-validation.csv <<'CSV'
          symbol
          MGY
          OPTX
          ANNA
          BRLS
          NEGG
          XPON
          ARLP
          V
          CSV
      - name: Run targeted SEC pipeline
        run: python -m ussy_fundamentals.pipeline --universe data/universe.annual-fallback-validation.csv
      - name: Audit targeted coverage
        run: python -m ussy_fundamentals.audit
      - name: Export targeted report
        run: python -m ussy_fundamentals.report
      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: annual-fallback-validation
          path: |
            data/processed/fundamentals_readiness_report.csv
            data/processed/fundamentals_readiness_summary.json
            data/processed/fundamentals_point_in_time.parquet
          if-no-files-found: error
          retention-days: 7
