name: Verify annual LT3 history

on:
  push:
    branches:
      - main
    paths:
      - "src/ussy_fundamentals/annual_history_verification.py"
      - "src/ussy_fundamentals/reconcile.py"
      - "tests/test_annual_history_verification.py"
      - "tests/test_reconcile.py"
      - ".github/workflows/annual-history-verification.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Recovery run containing fundamentals-full-universe-recovered
        required: true
        default: "34301078585"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: "1"
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '34301078585' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pytest

      - name: Run regression tests
        run: pytest -q

      - name: Download recovered full-universe artifact
        uses: actions/download-artifact@v4
        with:
          name: fundamentals-full-universe-recovered
          path: source
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Regenerate enriched readiness and taxonomy without SEC rerun
        run: |
          mkdir -p data/processed
          cp source/fundamentals_point_in_time.parquet data/processed/
          cp source/fundamentals_run_manifest.parquet data/processed/
          python -m ussy_fundamentals.report
          python -m ussy_fundamentals.exception_taxonomy

      - name: Verify ANNUAL_LT_3Y against SEC filing history
        run: python -m ussy_fundamentals.annual_history_verification

      - name: Upload annual history verification
        uses: actions/upload-artifact@v4
        with:
          name: annual-lt3-history-verification
          path: |
            data/processed/fundamentals_readiness_report.csv
            data/processed/fundamentals_readiness_summary.json
            data/processed/fundamentals_exception_taxonomy.csv
            data/processed/fundamentals_exception_taxonomy_summary.json
            data/processed/annual_lt3_verification.csv
            data/processed/annual_lt3_verification_summary.json
          if-no-files-found: error
          retention-days: 14
