name: Export unsupported FPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-unsupported-fpi
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Export canonical unsupported FPI set
        run: python -m ussy_fundamentals.export_unsupported_fpi
      - name: Show lineage
        run: cat data/processed/unsupported_fpi.json
      - name: Upload export
        uses: actions/upload-artifact@v7
        with:
          name: unsupported-fpi-current
          path: |
            data/processed/unsupported_fpi.csv
            data/processed/unsupported_fpi.json
          if-no-files-found: error
          retention-days: 14
