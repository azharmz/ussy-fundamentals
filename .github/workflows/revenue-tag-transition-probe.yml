name: Probe revenue tag transitions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/ussy_fundamentals/revenue_tag_transition_probe.py'
      - '.github/workflows/revenue-tag-transition-probe.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install pytest
      - name: Run regression tests
        run: pytest -q
      - name: Download quarterly revenue diagnosis
        uses: actions/download-artifact@v4
        with:
          name: quarterly-revenue-gap-diagnosis
          path: seed
          repository: azharmz/ussy-fundamentals
          run-id: 34318361573
          github-token: ${{ github.token }}
      - name: Probe actual post-cutoff revenue tags
        run: |
          mkdir -p data/processed
          cp seed/quarterly_revenue_gap_diagnosis.csv data/processed/quarterly_revenue_gap_diagnosis.csv
          python -m ussy_fundamentals.revenue_tag_transition_probe
      - uses: actions/upload-artifact@v4
        with:
          name: revenue-tag-transition-probe
          path: |
            data/processed/revenue_tag_transition_probe.csv
            data/processed/revenue_tag_transition_probe_summary.json
          if-no-files-found: error
          retention-days: 14
