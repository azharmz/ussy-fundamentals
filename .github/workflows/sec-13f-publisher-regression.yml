name: SEC 13F publisher regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/ussy_fundamentals/sec_13f_publish.py'
      - 'tests/test_sec_13f_publish.py'
      - '.github/run-sec-13f-publisher-regression'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Run 13F publisher fail-closed regression
        run: pytest -q tests/test_sec_13f_publish.py
