name: SEC 13F bulk event extraction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sec-13f-bulk-events.yml'
      - 'src/ussy_fundamentals/sec_13f_bulk_events.py'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Freeze canonical universe
        run: python -m ussy_fundamentals.universe_source
      - name: Extract latest published bulk filing events
        run: python -m ussy_fundamentals.sec_13f_bulk_events --universe data/processed/current_universe.csv --output-dir data/13f/bulk_events
      - name: Show summary
        run: cat data/13f/bulk_events/summary.json
      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: sec-13f-bulk-events-${{ github.run_id }}
          path: data/13f/bulk_events/
          retention-days: 14
