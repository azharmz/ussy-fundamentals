name: Diagnose quarterly EPS gaps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/ussy_fundamentals/quarterly_eps_gap_diagnose.py'
      - 'tests/test_quarterly_eps_gap_diagnose.py'
      - '.github/workflows/quarterly-eps-gap-diagnosis.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and tests
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install pytest

      - name: Run regression tests
        run: pytest -q

      - name: Download recovered full-universe report
        uses: actions/download-artifact@v4
        with:
          name: fundamentals-full-universe-recovered
          path: seed
          repository: azharmz/ussy-fundamentals
          run-id: 34301078585
          github-token: ${{ github.token }}

      - name: Diagnose quarterly EPS failures
        run: |
          mkdir -p data/processed
          cp seed/fundamentals_readiness_report.csv data/processed/fundamentals_readiness_report.csv
          python -m ussy_fundamentals.quarterly_eps_gap_diagnose

      - name: Upload quarterly EPS diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: quarterly-eps-gap-diagnosis
          path: |
            data/processed/quarterly_eps_gap_diagnosis.csv
            data/processed/quarterly_eps_gap_diagnosis_summary.json
          if-no-files-found: error
          retention-days: 14
