name: Full universe SEC fundamentals

on:
  workflow_dispatch:
    inputs:
      shard_count:
        description: Number of deterministic SEC shards
        required: true
        default: "24"
        type: choice
        options:
          - "12"
          - "16"
          - "24"
          - "32"

permissions:
  contents: read

concurrency:
  group: full-universe-sec
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Freeze canonical R2 universe for this run
        run: python -m ussy_fundamentals.universe_source

      - name: Build shard matrix
        id: matrix
        env:
          SHARD_COUNT: ${{ inputs.shard_count }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          n = int(os.environ["SHARD_COUNT"])
          print("matrix=" + json.dumps(list(range(n))))
          PY

      - name: Upload frozen universe contract
        uses: actions/upload-artifact@v4
        with:
          name: current-universe-contract
          path: |
            data/processed/current_universe.csv
            data/processed/current_universe_source.json
          if-no-files-found: error
          retention-days: 7

  shard:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Download frozen universe contract
        uses: actions/download-artifact@v4
        with:
          name: current-universe-contract
          path: seed

      - name: Build this shard universe
        run: |
          python -m ussy_fundamentals.shard_universe \
            --input seed/current_universe.csv \
            --output data/universe.current.shard.csv \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ inputs.shard_count }}

      - name: Run SEC PIT fundamentals pipeline
        run: python -m ussy_fundamentals.pipeline --universe data/universe.current.shard.csv

      - name: Audit shard
        run: python -m ussy_fundamentals.audit

      - name: Upload shard outputs
        uses: actions/upload-artifact@v4
        with:
          name: fundamentals-shard-${{ matrix.shard }}
          path: |
            data/processed/fundamentals_point_in_time_long.parquet
            data/processed/fundamentals_point_in_time.parquet
            data/processed/fundamentals_run_manifest.parquet
            data/universe.current.shard.csv
          if-no-files-found: error
          retention-days: 7

  merge:
    needs:
      - prepare
      - shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ always() && needs.shard.result == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Download frozen universe contract
        uses: actions/download-artifact@v4
        with:
          name: current-universe-contract
          path: seed

      - name: Download all shard outputs
        uses: actions/download-artifact@v4
        with:
          pattern: fundamentals-shard-*
          path: data/shards

      - name: Merge and reconcile all shards
        run: |
          python -m ussy_fundamentals.merge_shards \
            --root data/shards \
            --expected-universe seed/current_universe.csv
          cp seed/current_universe_source.json data/processed/current_universe_source.json
          cp seed/current_universe.csv data/processed/current_universe.csv

      - name: Audit full requested universe
        run: python -m ussy_fundamentals.audit

      - name: Upload merged full-universe outputs
        uses: actions/upload-artifact@v4
        with:
          name: fundamentals-full-universe
          path: |
            data/processed/fundamentals_point_in_time_long.parquet
            data/processed/fundamentals_point_in_time.parquet
            data/processed/fundamentals_run_manifest.parquet
            data/processed/current_universe.csv
            data/processed/current_universe_source.json
          if-no-files-found: error
          retention-days: 14
