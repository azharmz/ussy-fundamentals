name: SEC 13F historical PIT state full

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sec-13f-history-full.yml'
      - 'src/ussy_fundamentals/sec_13f_history_state.py'
      - 'src/ussy_fundamentals/sec_13f_bulk_catalog.py'
      - 'src/ussy_fundamentals/sec_13f_bulk_events.py'
      - 'src/ussy_fundamentals/sec_13f_filing.py'
      - 'tests/test_sec_13f_history_state.py'

permissions:
  contents: read

concurrency:
  group: sec-13f-history-full
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install pytest
      - name: Test historical event-state semantics
        run: pytest -q tests/test_sec_13f_history_state.py tests/test_sec_13f_filing.py
      - name: Freeze canonical universe
        run: python -m ussy_fundamentals.universe_source
      - name: Build all official historical PIT states
        run: python -m ussy_fundamentals.sec_13f_history_state --universe data/processed/current_universe.csv --output-dir data/13f/history_full
      - name: Show summary
        if: always()
        run: |
          if [ -f data/13f/history_full/summary.json ]; then cat data/13f/history_full/summary.json; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sec-13f-history-full-${{ github.run_id }}
          path: data/13f/history_full/
          if-no-files-found: warn
          retention-days: 14
