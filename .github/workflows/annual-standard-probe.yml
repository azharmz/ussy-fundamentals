name: Probe annual EPS source selection

on:
  push:
    branches: [main]
    paths:
      - 'src/ussy_fundamentals/annual_standard_probe.py'
      - '.github/workflows/annual-standard-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install pytest
      - name: Run regression tests
        run: pytest -q
      - name: Probe targeted annual EPS sources
        run: python -m ussy_fundamentals.annual_standard_probe
      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: annual-standard-probe
          path: |
            data/processed/annual_standard_probe.csv
            data/processed/annual_standard_probe_summary.json
          if-no-files-found: error
          retention-days: 7
