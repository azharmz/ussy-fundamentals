name: Cleanup guarded 13F orphan snapshot

on:
  workflow_dispatch:
    inputs:
      target_snapshot_prefix:
        description: Exact institutional_sponsorship/snapshots/YYYY-MM-DD/run-N prefix
        required: true
        type: string
      apply_delete:
        description: Apply deletion after guarded preflight
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      TARGET_SNAPSHOT_PREFIX: ${{ inputs.target_snapshot_prefix }}
      APPLY_DELETE: ${{ inputs.apply_delete }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Guarded snapshot cleanup and pointer verification
        run: python -m ussy_fundamentals.cleanup_13f_snapshot
