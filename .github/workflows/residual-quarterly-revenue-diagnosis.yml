name: Diagnose residual quarterly revenue gaps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/residual-quarterly-revenue-diagnosis.yml'
      - 'src/ussy_fundamentals/quarterly_revenue_gap_diagnose.py'
      - 'src/ussy_fundamentals/production_coverage.py'
      - 'src/ussy_fundamentals/reconcile.py'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and tests
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install pytest

      - name: Run regression tests
        run: pytest -q

      - name: Download latest targeted revenue validation
        uses: actions/download-artifact@v4
        with:
          name: targeted-revenue-tag-validation
          path: seed
          repository: azharmz/ussy-fundamentals
          run-id: 34322313604
          github-token: ${{ github.token }}

      - name: Rebuild readiness from post-patch targeted output
        run: |
          mkdir -p data/processed
          cp seed/processed/fundamentals_point_in_time.parquet data/processed/fundamentals_point_in_time.parquet
          cp seed/processed/fundamentals_run_manifest.parquet data/processed/fundamentals_run_manifest.parquet
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from ussy_fundamentals.production_coverage import can_slim_production_coverage
          from ussy_fundamentals.reconcile import combine_production_readiness

          wide = pd.read_parquet('data/processed/fundamentals_point_in_time.parquet')
          manifest = pd.read_parquet('data/processed/fundamentals_run_manifest.parquet')
          coverage = can_slim_production_coverage(wide)
          readiness = combine_production_readiness(manifest, coverage)
          readiness.to_csv('data/processed/fundamentals_readiness_report.csv', index=False)

          failures = readiness['failure_class'].fillna('').astype(str)
          revenue_mask = (
              failures.str.contains('QUARTERLY_REVENUE_YOY_INSUFFICIENT', regex=False)
              | failures.str.contains('QUARTERLY_REVENUE_YOY_STALE', regex=False)
          )
          residual = readiness.loc[revenue_mask].copy()
          residual.to_csv('data/processed/residual_revenue_readiness.csv', index=False)
          print(f'Residual revenue-failure symbols: {len(residual)}')
          print(residual[['symbol','cik','production_status','failure_class']].to_string(index=False))
          PY

      - name: Diagnose residual revenue failures
        run: |
          python -m ussy_fundamentals.quarterly_revenue_gap_diagnose \
            --readiness data/processed/fundamentals_readiness_report.csv \
            --output data/processed/residual_quarterly_revenue_gap_diagnosis.csv \
            --summary data/processed/residual_quarterly_revenue_gap_diagnosis_summary.json
          echo '--- residual diagnosis summary ---'
          cat data/processed/residual_quarterly_revenue_gap_diagnosis_summary.json

      - name: Upload residual revenue diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: residual-quarterly-revenue-diagnosis
          path: |
            data/processed/fundamentals_readiness_report.csv
            data/processed/residual_revenue_readiness.csv
            data/processed/residual_quarterly_revenue_gap_diagnosis.csv
            data/processed/residual_quarterly_revenue_gap_diagnosis_summary.json
          if-no-files-found: error
          retention-days: 14
