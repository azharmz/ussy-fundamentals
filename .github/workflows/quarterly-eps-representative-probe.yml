name: Probe representative quarterly EPS failures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quarterly-eps-representative-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Probe MGY ARLP and V
        run: |
          mkdir -p data/processed
          python -m ussy_fundamentals.diagnose --symbol MGY --metric eps | tee data/processed/diagnose_MGY_eps.txt
          python -m ussy_fundamentals.diagnose --symbol ARLP --metric eps | tee data/processed/diagnose_ARLP_eps.txt
          python -m ussy_fundamentals.diagnose --symbol V --metric eps | tee data/processed/diagnose_V_eps.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quarterly-eps-representative-probe
          path: data/processed/diagnose_*_eps.txt
          retention-days: 14
