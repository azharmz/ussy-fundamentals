name: TradingView FPI coverage audit

on:
  workflow_dispatch:
  push:
    branches:
      - run/tradingview-fpi-audit
      - run/tradingview-fpi-live-fallback-v2
    paths:
      - .github/workflows/tradingview-fpi-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Download canonical FPI export artifact
        uses: dawidd6/action-download-artifact@v12
        with:
          workflow: export-unsupported-fpi.yml
          name: unsupported-fpi-current
          path: data/processed
          search_artifacts: true
          if_no_artifact_found: fail
      - name: Audit TradingView coverage
        run: python scripts/audit_tradingview_fpi.py
      - name: Show summary
        run: |
          cat data/processed/tradingview_fpi_coverage_summary.json
          echo "live_fallback_rows=$(( $(wc -l < data/processed/tradingview_fpi_live_fallback_candidates.csv) - 1 ))"
      - uses: actions/upload-artifact@v7
        with:
          name: tradingview-fpi-coverage
          path: |
            data/processed/tradingview_fpi_coverage.csv
            data/processed/tradingview_fpi_coverage_summary.json
            data/processed/tradingview_fpi_live_fallback_candidates.csv
          if-no-files-found: error
          retention-days: 14
