name: SEC 13F Parquet codec benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-sec-13f-parquet-benchmark'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Benchmark current canonical Parquet without publishing
        run: python -m ussy_fundamentals.sec_13f_parquet_benchmark | tee parquet-benchmark.json
      - uses: actions/upload-artifact@v6
        with:
          name: sec-13f-parquet-benchmark-${{ github.run_id }}
          path: parquet-benchmark.json
